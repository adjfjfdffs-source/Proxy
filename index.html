<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTHUR PROXY SISTEMAVIP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        :root {
            --roxo: #7b2ffd;
            --rosa: #ff2d91;
            --fundo-card: rgba(20, 10, 40, 0.75);
            --texto: #e0e0e0;
            --cinza: #888888;
            --borda: rgba(123, 47, 253, 0.25);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                linear-gradient(135deg, rgba(15, 5, 26, 0.85), rgba(26, 15, 46, 0.9), rgba(21, 8, 37, 0.85)),
                url('https://i.pinimg.com/736x/4b/a5/cf/4ba5cfb988c0cc7f48694e2368957ead.jpg') center/cover no-repeat fixed;
            color: #fff;
            padding: 20px;
        }

        /* Tela de Login */
        .tela-login {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .caixa-login {
            background: var(--fundo-card);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 45px 35px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--borda);
            text-align: center;
            box-shadow: 0 0 30px rgba(123, 47, 253, 0.15);
        }

        .logo-nome {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--roxo), var(--rosa));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .sub-titulo {
            font-size: 13px;
            color: var(--cinza);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .input-codigo {
            width: 100%;
            padding: 15px 20px;
            background: rgba(15, 5, 26, 0.8);
            border: 1px solid var(--borda);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .input-codigo:focus {
            border-color: var(--roxo);
        }

        .botao-entrar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--roxo), var(--rosa));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .botao-entrar:hover {
            transform: scale(1.02);
        }

        .aviso-login {
            margin-top: 18px;
            font-size: 12px;
            color: #666;
        }

        /* Tela Principal - Proxy */
        .tela-principal {
            display: none;
            width: 100%;
            max-width: 520px;
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .info-esquerda h1 {
            font-size: 24px;
            background: linear-gradient(90deg, var(--roxo), var(--rosa));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-esquerda p {
            font-size: 12px;
            color: var(--cinza);
            margin-top: 4px;
        }

        .botao-sair {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .botao-sair:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .card {
            background: var(--fundo-card);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--borda);
        }

        .linha-opcao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .linha-opcao:last-child {
            border-bottom: none;
        }

        .opcao-nome {
            font-size: 15px;
            font-weight: 600;
        }

        .opcao-desc {
            font-size: 11px;
            color: var(--cinza);
            margin-top: 2px;
        }

        /* Switch / Botão */
        .toggle {
            width: 50px;
            height: 26px;
            background: rgba(42, 26, 64, 0.8);
            border-radius: 13px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle.ativo {
            background: linear-gradient(90deg, var(--roxo), var(--rosa));
            box-shadow: 0 0 12px rgba(255, 45, 145, 0.25);
            border-color: transparent;
        }

        .bolinha {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 3px;
            transition: transform 0.3s;
        }

        .toggle.ativo .bolinha {
            transform: translateX(22px);
        }

        .status-msg {
            margin-top: 20px;
            padding: 14px;
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid #10b981;
            border-radius: 0 10px 10px 0;
            color: #99f6e4;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .status-msg.mostrar {
            display: block;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div class="tela-login" id="telaLogin">
        <div class="caixa-login">
            <h1 class="logo-nome">ARTHUR PROXY</h1>
            <p class="sub-titulo">SISTEMA DE CONTROLE</p>
            <input type="text" class="input-codigo" placeholder="Código de acesso" id="codigoAcesso">
            <button class="botao-entrar" onclick="entrar()">ENTRAR</button>
            <p class="aviso-login">Acesso protegido • Privado</p>
        </div>
    </div>

    <!-- TELA PRINCIPAL / PROXY -->
    <div class="tela-principal" id="telaPrincipal">
        <div class="cabecalho">
            <div class="info-esquerda">
                <h1>ARTHUR PROXY</h1>
                <p>PROXY • CONTROLE REMOTO</p>
            </div>
            <button class="botao-sair" onclick="sair()">Sair</button>
        </div>

        <!-- COLUNA ESQUERDA -->
        <div class="card">
            <div class="linha-opcao">
                <div>
                    <div class="opcao-nome">BYPASS</div>
                    <div class="opcao-desc">Proteção antiban</div>
                </div>
                <div class="toggle" id="t-bypass" onclick="alternar('bypass')">
                    <div class="bolinha"></div>
                </div>
            </div>

            <div class="linha-opcao">
                <div>
                    <div class="opcao-nome">AIM ASSIST</div>
                    <div class="opcao-desc">Mira silenciosa</div>
                </div>
                <div class="toggle" id="t-aim_silent" onclick="alternar('aim_silent')">
                    <div class="bolinha"></div>
                </div>
            </div>

            <div class="linha-opcao">
                <div>
                    <div class="opcao-nome">SENSI ALTA</div>
                    <div class="opcao-desc">Sensibilidade 9x</div>
                </div>
                <div class="toggle" id="t-sensi_alta" onclick="alternar('sensi_alta')">
                    <div class="bolinha"></div>
                </div>
            </div>
        </div>

        <!-- COLUNA DIREITA -->
        <div class="card">
            <div class="linha-opcao">
                <div>
                    <div class="opcao-nome">HS PESCOÇO 30%</div>
                    <div class="opcao-desc">Trava no pescoço</div>
                </div>
                <div class="toggle" id="t-hs_pescoco" onclick="alternar('hs_pescoco')">
                    <div class="bolinha"></div>
                </div>
            </div>

            <div class="linha-opcao">
                <div>
                    <div class="opcao-nome">BACK JUMP</div>
                    <div class="opcao-desc">Movimento</div>
                </div>
                <div class="toggle" id="t-back_jump" onclick="alternar('back_jump')">
                    <div class="bolinha"></div>
                </div>
            </div>
        </div>

        <div class="status-msg" id="statusMsg">✅ SALVO COM SUCESSO!</div>
    </div>

<script>
const CODIGO_CORRETO = 'arthur123';

let config = {
    bypass: false,
    aim_silent: false,
    sensi_alta: false,
    hs_pescoco: false,
    back_jump: false
};

function entrar() {
    const cod = document.getElementById('codigoAcesso').value.trim();
    if (cod === CODIGO_CORRETO) {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPrincipal').style.display = 'block';
        carregarEstado();
    } else {
        alert('❌ Código incorreto!');
    }
}

function sair() {
    document.getElementById('telaPrincipal').style.display = 'none';
    document.getElementById('telaLogin').style.display = 'flex';
    document.getElementById('codigoAcesso').value = '';
}

async function alternar(chave) {
    config[chave] = !config[chave];
    document.getElementById('t-' + chave).classList.toggle('ativo', config[chave]);
    
    await fetch('/salvar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(config)
    });

    const msg = document.getElementById('statusMsg');
    msg.classList.add('mostrar');
    setTimeout(() => msg.classList.remove('mostrar'), 2500);
}

function carregarEstado() {
    fetch('/config.json')
        .then(r => r.json())
        .then(dados => {
            config = { ...config, ...dados };
            for (const k in config) {
                if (document.getElementById('t-' + k)) {
                    document.getElementById('t-' + k).classList.toggle('ativo', config[k]);
                }
            }
        });
}
</script>
</body>
</html>
